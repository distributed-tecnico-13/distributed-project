//
// Protocol buffers definition for DidaTrade Paxos Service
//
syntax = "proto3";
package didatrade;

// Only the configured leader sends this after confirming the prefix by Phase 2.
message InstallStateRequest {
  int32 ballot = 1;
  repeated PhaseOneResponseLogObject entries = 4;
}

message InstallStateReply {
  int32 serverid = 1;
  bool accepted = 2;
  int32 maxballot = 3;
}

message PhaseOneRequest {
  int32 requestballot	= 1;
}

message PhaseOneReply {
  int32 serverid        = 1;
  int32 requestballot	= 2;
  bool  accepted 	= 3;
  int32 maxballot       = 4;
  repeated PhaseOneResponseLogObject responseLogObjects = 5;
  bool membershiptransferred = 6;
}

message PhaseOneResponseLogObject {
  int32 instance        = 1;
  int32 value           = 2;
  int32 valballot       = 3;
}

message PhaseTwoRequest {
  int32 instance        = 1;
  int32 requestballot   = 2;
  int32 value           = 3;
}

message PhaseTwoReply {
  int32 instance        = 1;
  int32 serverid        = 2;
  int32 requestballot   = 3;
  bool  accepted        = 4;
  int32 maxballot       = 5;
}

message OpenFastRequest {
  int32 ballot = 1;
  int32 firstfastinstance = 2;
}

message OpenFastReply {
  int32 serverid  = 1;
  int32 ballot    = 2;
  bool  accepted  = 3;
  int32 maxballot = 4;
}

message LearnRequest {
  int32 instance   = 1;
  int32 ballot     = 2;
  int32 value      = 3;
  int32 serverid   = 4;
  bool  classic    = 5; // Phase 2 acceptance versus direct Fast acceptance.
}

message LearnReply {
  int32 instance   = 1;
  int32 ballot     = 2;
}

service DidaTradePaxosService {
  // Dynamic membership: the leader pushes the recovered prefix to the learners.
  rpc installstate (InstallStateRequest) returns (InstallStateReply);
  // Acceptor promise for a ballot; the reply lists every accepted slot.
  rpc phaseone (PhaseOneRequest) returns (PhaseOneReply);
  // Accept a value for one slot.
  rpc phasetwo (PhaseTwoRequest) returns (PhaseTwoReply);
  // Enter a Fast round; slots below firstfastinstance stay with classic recovery.
  rpc openfast (OpenFastRequest) returns (OpenFastReply);
  // Acceptors tell the learners which value they accepted.
  rpc learn    (LearnRequest)    returns (LearnReply);
}






