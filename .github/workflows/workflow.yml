name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: "22"

jobs:
  # ------------- pre-release ------------- #

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Select contract pom
        run: cp src/contract/intel-pom.xml src/contract/pom.xml
      - name: Check style and formatting
        run: mvn -B --file src/pom.xml checkstyle:check spotless:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # src/contract/pom.xml is not tracked in git, so the runner has to copy a
      # template before Maven can resolve the module. intel-pom.xml is the Linux
      # one (arm-pom.xml targets macOS), and ubuntu-latest is x86_64.
      - name: Select contract pom
        run: cp src/contract/intel-pom.xml src/contract/pom.xml
      - name: Run tests
        run: mvn -B --file src/pom.xml test
      - name: Run integration tests
        run: >
          mvn -B --file src/pom.xml -pl server -am
          -Dtest=MultiPaxosClusterIT
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Select contract pom
        run: cp src/contract/intel-pom.xml src/contract/pom.xml
      - name: Build
        run: mvn -B --file src/pom.xml clean install -DskipTests
